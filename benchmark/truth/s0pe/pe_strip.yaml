# S0-PE truth: pe_strip.exe (SP-01 plan section 2 schema; section 8.1 V-15, V-9; N5-8).
#
# Scored in the separate S0-PE table only (metrics [decomp, robust]): 2 DECOMP
# cells and 8 ROBUST cells across pe_sym + pe_strip. These fixtures are not in
# the 7-ELF S0 matrix and not in the section 3.7 mutant self-test. The fixture
# has no exploit, so vuln_family / method_* / distance are unscored and null/empty.
#
# Addresses are link-time virtual addresses in the objdump convention, i.e.
# ImageBase 0x140000000 + RVA (V-10).
#
# Provenance -- exact commands, run from benchmark/fixtures/s0pe
# (x86_64-w64-mingw32-gcc (GCC) 10-win32 20220113, mingw-w64 binutils):
#   x86_64-w64-mingw32-gcc -O0 -o pe_sym.exe pe_vuln.c
#   x86_64-w64-mingw32-strip -o pe_strip.exe pe_sym.exe
#   sha256sum pe_strip.exe
# pe_strip.exe has no symbols (`nm`: "no symbols"), so the addresses below are
# taken from the symbol-bearing build pe_sym.exe (truth/s0pe/pe_sym.yaml) and
# CONFIRMED to hold in the stripped file:
#   - pe_strip.exe is strip(pe_sym.exe), so the two share one layout:
#     `objdump -h` shows every section (.text .data .rdata .pdata .xdata .bss
#     .idata .CRT .tls .reloc) at the same VMA, size and file offset in both
#     (.text at file offset 0x400); the only difference is the COFF symbol and
#     string tables that `strip` drops;
#   - `objdump -s -j .text` of the two files hashes identically
#     (`... | tail -n +4 | sha256sum` ->
#     cf8c27d05e10eea827b03859db22ab6be141874e1e271703857040f624343a8d);
#   - `objdump -d -M intel --start-address=0x140001550 pe_strip.exe` shows the
#     same instructions at 140001550 (pe_vuln: ... call 0x1400026a0, the puts
#     thunk `jmp [__imp_puts]`) and at 14000156f (main: call 0x140001650
#     (__main), call 0x1400026a0 (the same puts thunk), call 0x140001550
#     (pe_vuln)); main calls puts itself, so the `puts` anchor is a call main makes;
#   - AddressOfEntryPoint is 0x14f0 in both (mainCRTStartup, 0x1400014f0).
# Rebuilding does not reproduce these bytes (the PE TimeDateStamp is the build
# time); the committed binary and its pinned SHA-256 are the reference.
slug: pe_strip
format: pe
arch: amd64
metrics: [decomp, robust]
binary:
  path: benchmark/fixtures/s0pe/pe_strip.exe
  sha256: ec60e14b980c7ecff08d4a6be544b7dab588cece32effdb932f74a0c15709f1a
vuln_family: null
method_accept: []
method_basis: null
solve_proven: null
distance: []
decompile:
  vuln_function:
    addr: 0x140001550
    provenance: "from pe_sym (nm: T pe_vuln); same VMA and bytes in the stripped file, see header"
  # User main only (V-9). The PE entry is the CRT start (mainCRTStartup,
  # 0x1400014f0), so a result of `entry` is an honest DECOMP FAIL. main calls puts
  # directly (see header), which is what the `puts` anchor below relies on.
  default_function_any_of: [0x14000156f]
  anchors: {calls: [puts], min_calls: 1}
stage:
  files: [pe_strip.exe]          # relative to benchmark/fixtures/s0pe
  placeholders: []
forbidden_symbols: [pe_vuln]
