# S0 truth for bon-nie-appetit (SP-01 plan 2.3). Smoke set: never a gate.
# Commands run from tests/htb-targets/organized (the binary is read in place).
slug: bon-nie-appetit
format: elf
arch: amd64
# Re-checked against heap_strlen_ofb1_techniques.py: a strlen-derived length on
# a never-NUL-terminated heap buffer gives a 1-3 byte overflow of chunk
# metadata. off_by_one stands, as in plan 2.3.
vuln_family: off_by_one
method_accept: [heap_metadata]
method_basis: reviewed
solve_proven: heap_strlen_ofb1
distance:
  # Kind known, value not yet extracted: VOID(no-truth), listed in the gaps column.
  - kind: chunk_to_next_size
    state: unknown
    provenance: >-
      plan 2.3. The overflow reaches the next chunk's size field; no number
      has been extracted here.
decompile:
  vuln_function:
    addr: 0xf36
    provenance: >-
      nm bon-nie-appetit | grep -w edit_order  ->  0000000000000f36 T
      edit_order. objdump -d --no-show-raw-insn bon-nie-appetit shows it
      calling strlen (0xfe3) and then read (0x100d), the strlen-derived
      length heap_strlen_ofb1_techniques.py describes.
  default_function_any_of: [0x10fc]
  anchors:
    calls: [read_num, new_order, edit_order]
    min_calls: 3
stage:
  files: [bon-nie-appetit]
  placeholders: []
forbidden_symbols: []
provenance:
  default_function: >-
    nm bon-nie-appetit | grep -w main  ->  00000000000010fc T main; plan 4.4
    step 1 (main symbol). Link-time vaddr of a PIE image; entry is 0x990
    (readelf -hW bon-nie-appetit).
  anchors: >-
    objdump -d --no-show-raw-insn bon-nie-appetit --disassemble=main | grep
    call -> memset, setup, banner, menu, read_num, new_order, show_order,
    edit_order, delete_order, printf, exit. Three program symbols are used.
    Not cross-checked against a Ghidra run.
  stage_files: >-
    ls -p tests/htb-targets/a12c7383-817e-4cff-a354-e050da854ad6/challenge ->
    bon-nie-appetit and the glibc/ directory (loader closure is added by
    staging).
  placeholders: "strings -a bon-nie-appetit | grep -ci flag -> 0"
  vuln_family: "plan 2.3, re-checked as noted in the header comment; unchanged"
  method_accept: "plan 2.3: heap_strlen_ofb1 is a heap-metadata attack"
