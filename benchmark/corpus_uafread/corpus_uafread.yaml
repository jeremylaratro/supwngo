#
# ---------------------------------------------------------------------------
# ORDERING -- NOT THIS FAMILY'S DECISION, and its cost is measured
# ---------------------------------------------------------------------------
#
# `heap_uaf_read` sits at position 22 of 28 in `FIRST_TECHNIQUES` (index 21,
# 0-based -- MEASURED off the list, not counted by eye) in
# `supwngo/exploit/pipeline/orchestrator.py`, AHEAD of `tcache_poison_got` (23)
# and `heap_record_hijack` (24). That file was not touched by this work -- the
# ordering is owned by the orchestrating session -- but the gate sweep shows this
# gate opens on all six `corpus_heap_variants` images, i.e. on the targets those
# two later executors own, so the position has a measurable cost and this manifest
# is where it belongs.
#
# ATTRIBUTION IS NOT STOLEN. MEASURED, `benchmark/measure_family.py
# benchmark/corpus_heap_variants --timeout 400` with this executor registered and
# ordered: **5/5 positives still SOLVED and still credited to
# `heap_record_hijack`, `verified=SHELL_ACCESS`; control still not solved; exit 0
# ALL OK.** Not one target changed hands.
#
# THE COST IS ~25 s PER IMAGE, and it is measured in isolation rather than
# inferred from the family delta. Driving `HeapUafReadExecutor.attempt()` directly
# against each of the six images (real `Binary.load` -> `ExploitContext` ->
# `run_static_analysis` -> `run_dynamic_profile` -> `attempt`):
#
#   gate cost 0.1-1.1 s, attempt 24.9-25.0 s, outcome **SKIPPED** at stage
#   ANALYSIS on all six -- i.e. it runs its whole recipe ladder (28 shapes),
#   discloses nothing, and declines with a measured reason. It never produces a
#   PARTIAL or FAILED record on these targets, so it cannot appear on the board
#   beside them.
#
# That 25.0 s matches the family-level delta exactly: 100.7-100.8 s per positive
# before (recorded by the session that built corpus_heap_variants, `--timeout 300
# --jobs 3`) against 125.9-126.7 s after (mine, `--timeout 400`), and 146.9 s
# against 170.7 s on the control. So the ordering position costs those five
# targets ~25 % more wall time and buys them nothing, while the anchor
# `11_heap_uaf_leak` -- which no other executor solves -- needs it. That trade is
# the orchestrating session's to make; this manifest only records both sides of it.
#
# ---------------------------------------------------------------------------
# DELIBERATELY NOT COVERED -- stated rather than rounded off
# ---------------------------------------------------------------------------
#
#   * **No write primitive, anywhere.** Not one target here reclaims a chunk to
#     overwrite a function pointer, a GOT slot or a record field. That is
#     `uaf`/`double_free`/`tcache_poison_got`/`heap_record_hijack` territory and
#     is already covered by corpus_heap_variants/. The consequence is that no
#     target in this family can reach SHELL_ACCESS and none is expected to.
#   * **No libc leak and no ASLR defeat.** The disclosed bytes are the secret
#     itself, never an address. A variant whose freed body held a live heap or
#     libc pointer would be measuring the repo's leak->resolve machinery, which
#     is a different capability.
#   * **No safe-linking interaction.** glibc 2.35 mangles freelist `next`
#     pointers, and nothing here reads or forges one -- the geometry is chosen
#     (0x420, above the tcache ceiling) specifically so the family does not
#     depend on tcache metadata at all. A tcache-sized variant would be a
#     legitimate sixth positive and is not here.
#   * **The five repairs in the control are not each proven individually
#     necessary.** See the ABL-A/B/C reading above. Two ablations were enough to
#     prove the oracle can go red; a full five-way ablation was not run.
#   * **The control is not proof of narrowness in general.** It proves this
#     family cannot be solved by a menu-reading or disclosure-shaped oracle
#     alone. What the gate does on unrelated images is measured separately and
#     named in full in GATE NARROWNESS above -- 18 out-of-family opens, not zero.
#   * **The anchor's own benign path was NOT fixed.** `11_heap_uaf_leak` still
#     prints its flag from `show(0)` with no free. It is a pre-existing corpus
#     target owned by another effort; this family exists partly to provide the
#     sealed-secret shape that target lacks.
