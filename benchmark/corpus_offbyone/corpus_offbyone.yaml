# Challenge-variation corpus manifest: OFF-BY-ONE / SINGLE-BYTE OVERFLOW
# (CWE-193 off-by-one error / CWE-787 out-of-bounds write). A fill whose bound is
# N writes at index N. Exactly ONE byte lands outside the region, every run, with
# no race and no allocator state involved.
#
# This family is not derived from an HTB target. It was opened as a NEW category
# on the ground that the category's whole difficulty is DOWNSTREAM of the bug:
# finding "a fill that writes at its own bound" is one instruction's worth of
# pattern matching, and what makes the category hard is that a single byte is not
# a payload. It only becomes one by borrowing whatever the compiler happened to
# place immediately after the buffer -- and that adjacent thing is what decides
# the entire exploit. So the axis this corpus varies is the MECHANISM that
# produces the byte, and the thing it measures is whether one capability survives
# the four different adjacent destinations that mechanism lands on.
#
# A NOTE ON PRE-EXISTING COVERAGE, STATED UP FRONT RATHER THAN DISCOVERED LATER
#
# `benchmark/corpus/13_off_by_one` (round 1, shared corpus) is already an
# off-by-one: `s.buf[n] = 0` with `n` clamped to `sizeof(buf)` instead of
# `sizeof(buf) - 1`, landing on an adjacent `int guard` the program then checks.
# It is NOT a member of this family and this family does not replace it. Every
# target here does something it does not:
#
#   * it has no menu, one command path, and one write; four of the five positives
#     here need a multi-part input program derived from the call path;
#   * its destination is a guard the program itself inspects -- the CHEAPEST of
#     the four destination classes, because the program performs the win for you.
#     Nothing in it exercises a frame pivot, a widened length, or a redirected
#     pointer;
#   * its win is `puts(FLAG)`. Every positive here ends in `system("/bin/sh")`,
#     so the oracle is a live shell rather than a printed string.
#
# The executor this family ships (`off_by_one_guard`) DOES open on it and DOES
# solve it, via route 4. That is reported in the executor's own docstring and in
# the OUT-OF-FAMILY GATE OPENS section below, because a new category quietly
# absorbing a pre-existing target would be the kind of unmeasured overlap that
# makes a benchmark stop meaning anything.
#
# WHAT THIS CORPUS MEASURES, AND WHAT IT DOES NOT
#
# Measures: whether one solve capability GENERALISES across the particulars of a
# single vulnerability category. The DEFECT is held identical in shape across all
# five positives -- a fill bounded by N that writes at index N -- and exactly one
# thing varies: the mechanism that produces the extra byte, and therefore which
# frame slot it lands on. A per-target difference is attributable to that, not to
# a different bug.
#
# Held identical in every target (each source header says it at length):
#
#   the defect      a fill bounded by N writes at index N. In four of the five
#                   the bound is `sizeof` the destination; in the fifth it is
#                   snprintf's untruncated return value clamped to the same
#                   quantity.
#   the shell site  `win()` -> `system("/bin/sh")`. Exactly one, non-static so
#                   it survives as a symbol whatever else changes.
#   the menu        `1) info  2) edit  0) quit`, the defect always reached by
#                   command '2', prompts and labels identical.
#   the call depth  `main -> handle(c) -> do_*()`. The off-by-one is always two
#                   calls deep, so `main`'s command loop is never damaged and a
#                   failed probabilistic attempt costs one respawn, not a
#                   corrupted oracle.
#   I/O primitives  `read`/`write` only in the four pivot/guard targets (no
#                   printf/scanf), so no stdio buffer can sit between the client
#                   and the defect. obo_14 is the exception and says why.
#   cflags          byte-identical in all six directories, control included.
#
# NOT held identical, stated so it cannot be mistaken for a hidden second bug:
# the SHAPE OF THE RECORD follows from the axis point. A length guard and a saved
# pointer have to be adjacent to the overflowed array, which means a struct;
# a saved-RBP pivot needs the array to be the function's only local, which means
# no struct members after it. The fill and its bound are unchanged either way.
#
# Does NOT measure: any leak -> resolve -> libc finisher, and no PIE variant of
# the three routes that need an in-image code address. See DELIBERATELY NOT
# COVERED at the end, which states that gap rather than rounding it off.
#
# THE PRIMITIVE, AND WHY THREE OF FIVE POSITIVES ARE PROBABILISTIC
#
# The headline destination for a one-byte overflow is the LOW BYTE OF A SAVED
# FRAME POINTER. Zeroing it moves the caller's frame pointer down to the bottom
# of its own 256-byte block; the caller's `leave; ret` then pops a frame pointer
# from, and returns through, memory the attacker filled. The executed word is at
#
#     L = (H & ~0xff) + 8            H = the true frame pointer
#
# and `H` is a live stack address. Linux offsets the initial stack per exec by
# `arch_align_stack`: `get_random_int() % 8192`, masked down to 16. So `H & 0xff`
# is a fresh multiple of 16 on every run, it cannot be computed from the image,
# and this family carries no leak. Worse, when `H & 0xff` is ALREADY zero the
# write changes nothing and the program returns normally.
#
# THEREFORE NO SINGLE ATTEMPT AT THIS ROUTE CAN EXCEED 15/16, whatever the
# exploit does. That is a property of the primitive. The three pivot targets here
# measure BELOW 15/16 by different amounts, and the amount is a function of the
# frame geometry: the gap between the top of the sprayed region and `H` costs one
# landing slot per 16 bytes. This is why the corpus holds the frame layout
# roughly constant and measures the rate per target rather than asserting one.
#
# obo_12 and obo_13 are DETERMINISTIC and exist precisely so that "did the
# technique work?" and "did the dice land?" are not entangled: a family whose
# every member was probabilistic could not tell a broken executor from an
# unlucky one.
#
# THE ALIGNMENT DETAIL THAT IS NOT COSMETIC
#
# Because the landing offset is unknown, the landing zone is sprayed with a
# repeating 16-byte unit `[p64(win), p64(ret_gadget)]` rather than a chain at a
# fixed place. `rbp` is 16-aligned in every -O0 frame, so a buffer at `-X(%rbp)`
# with `X % 16 == 0` starts 16-aligned, and `L` is ALWAYS `8 (mod 16)`. Every
# landing therefore hits the bare `ret`, slides one word, and enters `win` with
# `rsp` `8 (mod 16)` -- the parity a `call` leaves behind, which is what glibc's
# `system()` needs for its `movaps`. Landing directly on `win` would be
# 16-aligned and would fault INSIDE `system()`, i.e. it looks exactly like a
# wrong gadget address rather than like an alignment bug. Getting this wrong was
# a measured failure during construction, not a hypothetical.
#
# PROTECTIONS -- MEASURED OFF THE BINARIES 2026-09-28
#
# All six identical: **NX on, canary OFF, no PIE, Full RELRO.** Read with
# `readelf -lW` (GNU_STACK `RW`, GNU_RELRO present) and `readelf -dW`
# (FLAGS BIND_NOW), cross-checked against pwntools' own ELF checksec
# (`nx=True canary=False pie=False relro=Full`).
#
# ERRATUM, 2026-09-28, beside the original claim rather than replacing it:
# this section first recorded that "supwngo's OWN protection reporting disagrees
# -- `NX Disabled / RELRO No RELRO`", and called it a pre-existing framework
# defect. **That is wrong, and the way it is wrong matters more than the claim.**
# Re-measured on `obo_10_loop_le_saved_rbp`:
#
#   Binary.load(path).protections  ->  NX Enabled   RELRO Full RELRO   (correct)
#   Binary(path).protections       ->  NX Disabled  RELRO No RELRO     (all defaults)
#
# So the framework reports protections CORRECTLY. The wrong answers come from the
# bare `Binary(path)` constructor, which returns a fully-formed object whose ELF
# was never parsed, so every protection reads as its default. `readelf` and
# pwntools agree with `Binary.load`, not against it.
#
# Kept here because this is the SECOND time in one day that this exact footgun
# produced a confident wrong measurement: a gate sweep written against
# `Binary(path)` reported `gate OPEN on: 0` for all 133 images -- including its
# own positives -- and read as a flawlessly narrow gate. A constructor that
# silently yields plausible all-default answers is the defect; the protections
# code is not. Logged as such in
# `docs/process/2026-09-27-deferred-deficiencies.md`.
#
# The numbers above are readelf's, and `Binary.load` concurs.
#
# canary OFF is the ONE deliberate weakening, and its effect on this category is
# unusual enough to be worth the paragraph that is in `cflags`: a canary does not
# DETECT the saved-RBP pivot (the canary sits at -0x8(%rbp), BELOW the byte being
# written, so the epilogue check passes). What `-fstack-protector` does is MOVE
# THE TARGET -- it relocates local arrays so they end at the canary slot instead
# of at the saved RBP, and the extra byte then hits the canary and aborts. And it
# does not defeat obo_12 or obo_13 AT ALL, because their destinations are members
# of the same struct as the overflowed array and no frame reordering can be
# inserted between struct members. That asymmetry is a real property of the
# category, so the flag is held off family-wide rather than varied inside it.
#
# -no-pie is a stated SIMPLIFICATION, not a claim about the defect: three of the
# four routes need an in-image code address and the primitive delivers no leak,
# so under PIE they would become two-stage exploits and the family would be
# measuring leak plumbing. Route 4 (guard word) needs no address and does work on
# a PIE image -- which is exactly how the executor solves the PIE round-1 target.
#
# THE ONE VARIABLE: THE MECHANISM, AND THE DESTINATION IT LANDS ON
targets:
  - slug: obo_10_loop_le_saved_rbp
    role: positive
    mechanism: >
      A `for (i = 0; i <= n; i++)` read loop, one byte per iteration, straight
      out of `read(0, &dst[i], 1)`. This is the ANCHOR: every other source was
      generated from it, so the held-constant parts are byte-identical rather
      than merely similar. Because the extra iteration is ATTACKER-FED, the extra
      byte is whatever the client sends as byte N+1 -- so this is the one pivot
      variant where the attacker chooses the byte, and the only correct choice is
      0x00.
    destination: the saved RBP at (%rbp) of do_edit(). `buf` is the function's
      only local, 0x400 bytes, ending flush against it.
    route: saved_rbp_pivot
    deterministic: false
    per_attempt_rate: >
      DERIVED 13/16 == 81.25%: `handle` allocates 0x10 of locals and the sled's
      top is 0x20 below H, so the landing loses on low bytes {0x00, 0x10, 0x20}.
      MEASURED 26/32 == 81.2% at n=32 and 73/96 == 76.0% at n=96 (reference
      exploit `--rate`). See the note under RE-MEASURED AT n=96: all three pivot
      targets land ~6 points under their derived ceilings by the same amount,
      which is read as probe flake rather than as a geometry error.
    win: frame pivot into the sprayed `buf`, ret-slide, `win()` ->
      `system("/bin/sh")`.
  - slug: obo_11_strcpy_nul_at_len
    role: positive
    mechanism: >
      A strcpy-shaped terminator: `set_label()` does `if (len > cap) len = cap;`
      then `memcpy(dst, src, len); dst[len] = '\0';`. The clamp's ceiling IS the
      buffer size, so `len == cap` is admitted and the terminator lands one past
      the end. Same landing site as obo_10, but the byte is FORCED to NUL by the
      program -- the attacker does not choose it. An executor that treats "write
      0x00 past the buffer" as an input it controls and one that reads the byte's
      value out of the store instruction behave identically here and differ on
      obo_12, which is the point of having both.
    destination: the saved RBP at (%rbp) of do_edit(), reached through the
      `label` member of a 0x400-byte record.
    route: saved_rbp_pivot
    deterministic: false
    per_attempt_rate: >
      DERIVED 12/16 == 75%: the record is `{ char body[0x3f0]; char label[0x10]; }`
      and only `body` can hold the sled -- a `strlen`-bounded `memcpy` cannot
      carry a `p64()`, because on a -no-pie x86-64 image every code address
      contains five 0x00 bytes. So the sled's top is 0x30 below H (0x10 of
      `label` plus `handle`'s 0x20) and the landing loses on {0x00, 0x10, 0x20,
      0x30}. MEASURED 19/32 == 59.4% at n=32 and 64/96 == 66.7% at n=96 -- the
      LOWEST in the family, as the derivation predicts, and the target whose
      n=32 sample sat far enough under its derivation to be worth re-measuring
      rather than reporting once.
    win: frame pivot into the sprayed `body`, ret-slide, `win()`.
    note: >
      The record split is the whole reason this variant exists. Its NUL-intolerant
      write cannot lay its own landing zone, so the landing zone has to come from
      a DIFFERENT, NUL-tolerant read earlier on the same path. An executor that
      sprays "the buffer the off-by-one overflowed" fills 16 of the bytes it needs
      here.
  - slug: obo_12_length_guard_two_stage
    role: positive
    mechanism: >
      A `for (i = 0; i <= n; i++)` byte copy from a global staging buffer, so the
      extra byte is CLIENT-CHOSEN, and it must be 0xff rather than 0x00: the
      destination is a length guard initialised to 0x10, and a NUL would make it
      SMALLER and the defect harmless. This is the target that breaks an executor
      built against obo_10/obo_11 -- everything downstream of the byte is
      different, and the byte's required value is inverted.
    destination: the low byte of `unsigned int cap` at -0x50(%rbp), a member of
      `struct rec { char name[0x20]; unsigned int cap; char body[0x40]; }`.
    route: length_guard
    deterministic: true
    per_attempt_rate: >
      DERIVED 1/1: no stack address is involved. Stage 1 widens `cap` from 0x10
      to 0xff; stage 2 spends the widened `read(0, r.body, r.cap)` on 84 bytes of
      filler (0x4c to `body`, plus 8 over the saved RBP slot) then a bare `ret`
      then `win`. MEASURED 32/32.
    win: the widened read overflows `r.body` to do_edit()'s return address --
      an ordinary ret2win, authorised by one byte.
    note: >
      The ONLY deterministic pivot-free positive, and the reason the family can
      distinguish "the technique failed" from "the dice lost". Also the variant
      `-fstack-protector` would not touch: `name` and `cap` are members of one
      struct and no frame reordering separates them.
  - slug: obo_13_saved_ptr_low_byte
    role: positive
    mechanism: >
      A clamp whose ceiling is the array size: `if (n > NAME_SZ) n = NAME_SZ;`
      then `r.name[n] = '\0'`, with `n` the return value of
      `read(0, r.name, NAME_SZ)`. `>` admits `n == NAME_SZ`. Program-written NUL,
      and in this destination class the NUL is exactly right.
    destination: the low byte of `char *dst` at -0x10(%rbp), a member of
      `struct rec { char name[0x20]; char *dst; }`.
    route: saved_pointer
    deterministic: true
    per_attempt_rate: >
      DERIVED 1/1: the pointer's target is not a stack address, so nothing about
      it is randomised. `g_state` is declared `__attribute__((aligned(256)))`
      with a function pointer at offset 0, `r.dst` starts at `g_state.notes` ==
      `&g_state + 8`, and zeroing its low byte moves it to `&g_state.action` --
      a link-time constant (0x404100) on a -no-pie image. MEASURED 32/32.
    win: the program's own `read(0, r.dst, 8)` writes `p64(win)` over the
      function pointer, and its own `g_state.action()` calls it.
    note: >
      The 256-byte alignment is part of the FIXTURE, not a cheat. A one-byte
      pointer overwrite can only move a pointer inside its own aligned 256-byte
      block -- that IS the primitive. In the wild the attacker wins when
      something useful happens to share that block, and whether it does is a fact
      about the target's data layout. Pinning the block holds that fact constant
      instead of letting a linker's choice of address turn into an apparent
      executor regression.
  - slug: obo_14_snprintf_ret_caller_frame
    role: positive
    mechanism: >
      snprintf's RETURN VALUE -- the length it WOULD have written -- clamped to
      `cap` instead of `cap - 1`, then used as a terminator index. Two things
      here are deliberately hostile to a gate written against the other four:
      there is no inclusive comparison against a size_t cursor anywhere (the
      compare is a SIGNED `jle` against an `int` that came out of a return
      register), and no byte of the source ever reaches the overflowed index.
    destination: the saved RBP at (%rbp) of do_tag(), whose ONLY local is a
      0x20-byte `name` -- far too small to hold a landing zone.
    route: saved_rbp_pivot
    deterministic: false
    per_attempt_rate: >
      DERIVED 15/16 == 93.75%, the HIGHEST in the family even though the
      overflowed buffer is the smallest: `handle` does `sub $0x410,%rsp`, puts
      `board` at -0x400(%rbp) and spills its `c` argument BELOW the array at
      -0x404(%rbp), so the landing zone ends FLUSH against H and only 0x00 (the
      no-op) loses. MEASURED 28/32 == 87.5% at n=32 and 85/96 == 88.5% at n=96 --
      the highest measured rate in the family, as derived. An earlier revision of
      the source header PREDICTED
      -0x410 with a 0x10 gap and a 14/16 ceiling; that was wrong and the erratum
      is recorded in the source rather than silently replaced.
    win: frame pivot into `handle`'s sprayed `board`, ret-slide, `win()`.
    note: >
      The landing zone lives in the CALLER's frame and is filled by a different
      read, in a different function, BEFORE the overflow happens. This is the
      target that tells apart an executor that sprays "the overflowed buffer"
      from one that sprays every attacker-writable region on the path to the
      defect -- the former covers 32 of the up-to-248 bytes it needs.
  - slug: obo_90_neg_bound_fixed
    role: control
    mechanism: >
      obo_10 with ONE CHARACTER CHANGED: `for (i = 0; i < n; i++)`. Everything
      else is byte-identical -- the same `win()` calling `system("/bin/sh")`, the
      same `main -> handle -> do_edit` depth, the same 0x400-byte single local
      ending flush at (%rbp), the same menu, the same prompts, the same cflags.
      `win()` is present and unreachable.
    destination: nothing. The highest byte written is `buf[0x3ff]`; the saved RBP
      is never touched, and a correct exact-length fill is the program's only
      write, so there is no second read to widen, no pointer to redirect and no
      guard to zero either.
    route: none -- REFUSED BY THE STATIC HALF of the gate, on the single fact the
      category turns on (the terminating comparison is `jb`, not `jbe`), rather
      than by exhausting a retry budget. A refusal that depends on a budget
      cannot distinguish "not vulnerable" from "unlucky", which for a
      probabilistic family would make the control worthless.
    deterministic: n/a
    win: none.
    note: >
      It is obo_10 rather than a stripped-down program on purpose: if `win()` and
      the frame geometry were also removed, a decline would be attributable to
      any of four differences instead of to the missing byte.

