#
# OUT-OF-FAMILY GATE OPENS -- one, named, and correct
#
#   benchmark/corpus/13_off_by_one/off_by_one
#     A genuine pre-existing off-by-one. `vuln()` fills a 0x20-byte buffer at
#     -0x30(%rbp) with an inclusive clamp, so the terminator lands at
#     -0x10(%rbp) -- an `int guard` initialised to 0xdeadbeef which the program
#     then checks with `if ((s.guard & 0xff) == 0) win();`. Route 4
#     (guard_word). The gate opens because the image really does contain the
#     defect this executor owns, and the executor solves it. This is coverage,
#     not a false positive, and it is the reason route 4 exists at all: without
#     it the executor would decline a target that is literally what the
#     technique is NAMED for.
#
#     Matching it required one addition to the static matcher that is worth
#     recording as a general improvement rather than a special case: gcc emits
#     the one-past store in TWO forms at -O0 -- `lea` a base, `add` the index,
#     store through it (when the base is a pointer variable) and a single SIB
#     store `movb $0x0,-0x30(%rbp,%rax,1)` (when the base is a frame array).
#     A matcher that knows only the first form misses half the category.
#
