# MEASUREMENT RECORD
#
# Every number below was produced by the command quoted above it, on this host,
# on 2026-09-28. Nothing here is copied from a sibling family or estimated.
#
# 1. CORPUS ORACLE PROOF -- positive AND negative, before anything that trusts it
#
#    $ python3 benchmark/reference_exploits/offbyone_variants_reference.py
#
#    obo_10  SHELL (1 attempt)   expected solvable      PASS
#    obo_11  SHELL (1 attempt)   expected solvable      PASS
#    obo_12  SHELL (1 attempt)   expected solvable      PASS
#    obo_13  SHELL (1 attempt)   expected solvable      PASS
#    obo_14  SHELL (2 attempts)  expected solvable      PASS
#    obo_90  plan declined, no shell   expected NOT solvable   PASS
#    -> "ALL OK -- corpus is a usable oracle", exit 0.
#
#    (Run twice: once against the first build, and again after the sources'
#    comment corrections were rebuilt. Both passed. The attempt COUNTS differ
#    between runs on the three pivot targets and are expected to -- that is the
#    probabilistic route being probabilistic, and a run in which every pivot
#    target won on attempt 1 every time would be the suspicious one.)
#
#    The control's refusal is on the STATIC half: "no off-by-one found: every
#    fill bound in this image is exclusive". It is not a budget exhaustion.
#
#    It went RED first, twice, and both are recorded because both were real
#    construction bugs rather than tuning:
#      * obo_10 measured 0/32 shells with the sprayed pattern built as
#        `(p64(win) + p64(ret)) * 128` -- a 16-byte unit repeated 128 times is
#        2048 bytes, not 1024, so the byte at stream[1024] was a pattern byte
#        instead of the trailing NUL and the saved RBP took 0xc9 (win's low byte)
#        instead of 0x00. Crash rip was `ret_gadget << 16`, which reads like a
#        wrong gadget. The repeat count is `size // 16`, not `size // 8`.
#      * obo_14 declined outright until the input-event walk was started from the
#        DISPATCHER instead of from the overflowed frame, because its landing zone
#        is a local of the caller.
#
# 2. MEASURED PER-ATTEMPT RATES (the probabilistic route's real ceiling)
#
#    $ python3 benchmark/reference_exploits/offbyone_variants_reference.py --rate
#
#    obo_10_loop_le_saved_rbp           pivot    26/32     (derived 13/16 = 81.2%)
#    obo_11_strcpy_nul_at_len           pivot    19/32     (derived 12/16 = 75.0%)
#    obo_12_length_guard_two_stage      length   32/32     (derived 1/1)
#    obo_13_saved_ptr_low_byte          pointer  32/32     (derived 1/1)
#    obo_14_snprintf_ret_caller_frame   pivot    28/32     (derived 15/16 = 93.8%)
#    obo_90_neg_bound_fixed             declined
#
#    The two deterministic routes coming back 32/32 and the three pivot routes
#    coming back at three DIFFERENT non-trivial rates is itself the evidence that
#    the harness measures something: an always-green oracle cannot produce 19/32.
#
# 2b. RE-MEASURED AT n=96 (obo_11's n=32 sample sat ~2 sigma under its
#     derivation, which was worth resolving rather than reporting once)
#
#    $ python3 -c "... R.rate(<path>, n=96) ..."   # same attempt() as --rate
#
#    obo_11_strcpy_nul_at_len           64/96 = 66.7%   (derived 12/16 = 75.0%)
#    obo_10_loop_le_saved_rbp           73/96 = 76.0%   (derived 13/16 = 81.2%)
#    obo_14_snprintf_ret_caller_frame   85/96 = 88.5%   (derived 15/16 = 93.8%)
#
#    ALL THREE COME IN 5-8 POINTS UNDER THEIR DERIVED CEILING, BY ALMOST THE SAME
#    AMOUNT, while the three geometries differ. That pattern is recorded rather
#    than smoothed over, and the reading of it is INFERRED, not measured: a
#    geometry error would move ONE target by a multiple of 1/16 (6.25 points) and
#    leave the others alone, whereas a constant offset across three different
#    geometries is what a per-attempt PROBE flake looks like -- each attempt is a
#    fresh exec plus fixed 0.12 s settles plus a 1.0 s output window, and an
#    attempt whose shell is simply not ready inside that window is scored as a
#    miss. So the derived ceilings are believed correct and the measured rates are
