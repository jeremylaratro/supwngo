# DELIBERATELY NOT COVERED -- stated rather than rounded off
#
#   * No PIE variant of routes 1-3. All three need an in-image code address and
#     the primitive delivers no leak, so a PIE variant would be measuring a
#     leak-then-resolve finisher this pipeline does not have. The executor
#     DECLINES rather than guessing: `_symbol()` refuses to hand back an address
#     for a non-ET_EXEC image. Route 4 needs no address and does work on PIE,
#     which is demonstrated by the round-1 target rather than asserted.
#   * No heap off-by-one (a one-byte overflow into an adjacent chunk's size
#     field, the classic "poison null byte"). That is a different primitive with
#     a different set of downstream requirements and belongs with the heap
#     families, not here; putting it in this corpus would break the
#     one-varied-axis property.
#   * No arbitrary-write finisher for route 3 when nothing in the image calls
#     through the address the pointer can be moved to. The pointer moves inside
#     256 bytes and whether anything useful lives there is a fact about the
#     target; when it does not, the executor declines with that stated.
#   * No 32-bit variant. The frame arithmetic, the 16-byte alignment rule and
#     the `movaps` constraint are all amd64 facts, and an i386 member would vary
#     the architecture as well as the mechanism.
