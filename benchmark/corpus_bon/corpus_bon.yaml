# ---------------------------------------------------------------------------
# GLIBC PIN -- A DELIBERATE CHOICE, ITS CONSEQUENCE, AND WHAT STAYS UNMEASURED
# ---------------------------------------------------------------------------
#
# This corpus is pinned to the BUILD HOST's glibc (measured: 2.35), NOT to the
# 2.27 the real `bon-nie-appetit` bundles. The reason is measured, not assumed:
# `benchmark/build_all.sh` builds with the host gcc, and a host-gcc binary
# records a `GLIBC_2.34` requirement from `Scrt1.o`/`__libc_start_main`, so
# running one against the target's bundled libc fails outright with
# ``version `GLIBC_2.34' not found``. A 2.27-pinned corpus would need a committed
# ~100 MB Ubuntu 18.04 sysroot with an absolute `--sysroot` baked in, or a docker
# build step. Both break the one property a corpus must have: rebuilding from a
# fresh clone on any host with `benchmark/build_all.sh`.
#
# The consequence, stated plainly rather than rounded off:
#
#   * The PRIMITIVE is version-independent and IS measured faithfully here:
#     strlen-derived length -> chunk-size corruption -> overlapping chunks ->
#     unsorted-bin (main_arena) libc leak off the `"%s"` print -> tcache poison.
#   * The FINISHER is NOT version-independent, so this corpus measures a
#     DIFFERENT finisher than the real target needs:
#       - target, glibc 2.27 (<=2.33): `__free_hook` is still honoured, so the
#         finisher is `__free_hook = system` then `free("/bin/sh")`.
#       - this corpus, glibc 2.35 (>=2.34): `__free_hook` is no longer called,
#         safe-linking mangles tcache `next`, and `tcache_get` gates on
#         `counts[] > 0`. The finisher is the structural analogue -- overwrite
#         `free@got.plt` with `system`, then `free("/bin/sh")`.
#     Both branches therefore get a live proof instead of one being asserted:
#     this corpus exercises >=2.34, and `bon-nie-appetit` under its own bundled
#     2.27 exercises <=2.33.
#
# UNMEASURED, and named so nobody reads the two proofs above as three:
#
#   * The **2.30/2.31 middle case** falls out of the same code with `key = 0` and
#     has NOT been run. Two branches are proven, on 2.27 and 2.35; the middle is
#     inferred.
#   * A **PIE target on a >=2.34 libc** is DECLINED by design -- the got.plt
#     finisher needs a fixed address and this family forbids the leak that would
#     supply one. That is a stated limit, not a silent failure.
#
# MEASURED PRECISION TRAP (do not "fix" this by testing for the symbol):
# `__free_hook` is STILL an exported symbol in 2.35 -- `nm -D` finds it in the
# host libc -- but the malloc path stopped calling it in 2.34. A capability test
# that greps for the symbol therefore wrongly concludes the 2.35 path works.
# Branch on the glibc RELEASE, never on symbol presence.
