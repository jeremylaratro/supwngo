#
# A CLEANUP DEFECT FOUND BY CHECKING, AND FIXED
#
# The first measure_family run left THREE /tmp/.supwngo_libhijack_<pid> scratch
# directories behind. Cause: the generated script removed its scratch at the end
# of bridge(), but on a WINNING run the script ends inside io.interactive() and is
# terminated there by whoever owns it -- so the one code path that never ran the
# cleanup was the successful one. The scratch held only the compiled payload, not
# a plant in any search path, so no measurement was corrupted; it is recorded here
# because "cleanup runs except when you win" is the shape of defect this family is
# supposed to catch. Fixed with an atexit handler, and re-verified: a winning run
# now leaves NONE, confirmed both by hand and after a full six-target
# measure_family run.
#
# GATE NARROWNESS -- MEASURED, AND THE SUBJECT PROVEN PRESENT
#
# The executor's applicability check was called DIRECTLY (no exploits run) on
# every ELF executable under benchmark/corpus*/ and tests/htb-targets/:
#
#   ELF executables swept          132   (10 of them under tests/htb-targets/)
#   gate OPENED on                   5   -- exactly the five positives
#   openings outside those five      0
#   exceptions raised                0
#
# A 0-openings result over images that carry none of the gate's subjects would
# prove nothing, so the subjects were counted too:
#
#   images carrying dlopen/dlmopen in the PLT   5  (the 4 dlopen positives + the
#                                                  control, which DECLINES)
#   images carrying DT_RUNPATH or DT_RPATH      5  (libhj_12, libhj_13, and THREE
#                                                  HTB targets)
#
# The three HTB targets are the important ones: rocket_blaster_xxx, sabotage and
# bon-nie-appetit all carry `RUNPATH ['./glibc/']` with `NEEDED ['libc.so.6']` --
# the bundled-glibc shape that is the HTB house style. A naive "has a relative or
# $ORIGIN RUNPATH" gate would claim all three. This one declines all three, and
# says why: "every DT_NEEDED soname is a system library resolvable from the
# default directories".
#
# THE TWO FILTERS THAT KEEP THE RPATH ROUTE NARROW, AND PROOF EACH IS NEEDED
#
#   FILTER 1  the needed soname must NOT be resolvable from the default system
#             directories. Without it, every bundled-glibc binary is a hit, and
#             "hijacking" one would mean OVERWRITING its shipped libc -- a
#             different act entirely.
#   FILTER 2  a REAL DIRECTORY must precede the entry where the needed object is
#             actually found, and must not already contain it. Without it, every
#             image whose dependency is found in its FIRST search entry is a hit,
#             and again winning would mean overwriting the program's own library.
#
# GATE RED PROOFS -- five mutations, each WRONG-BUT-PRESENT
#
# Each mutation edits a tracked corpus source or cflags so the CHANNEL IS STILL
# THERE but is no longer the defect, rebuilds a genuinely working program from the
# mutated source into a /tmp mirror (the validated corpus ELF is never touched),
# and asserts the gate goes RED. Every mutant was RUN and its legitimate plugin
# load shown, because a mutation the compiler or the program rejects proves
# nothing. Every source was then restored and the restoration verified by sha256.
#
#   M1  libhj_10  dlopen literal "./plugins/libsupwngoext.so.1" -> the ABSOLUTE
#                 "/tmp/supwngo_libhj_m1/libsupwngoext.so.1". Still a dlopen
#                 string literal; no longer cwd-relative.                    RED
#                 mutant works: "plugin: supwngo reference extension v1"
#   M2  libhj_11  getenv(SUPWNGO_PLUGIN_DIR) -> secure_getenv. Same variable,
#                 same snprintf, same dlopen -- hardened reader.              RED
#                 mutant works: "plugin: supwngo reference extension v1"
#   M3  libhj_14  the opendir/readdir loop -> one snprintf of the SAME directory
#                 and soname. The computed path and its builder are still there;
#                 only the enumeration is gone.                               RED
#                 mutant works: "plugin: supwngo reference extension v1"
#   M4  libhj_13  DT_RPATH "$ORIGIN/lib:$ORIGIN/vendor" -> "$ORIGIN/vendor:
#                 $ORIGIN/lib". Both entries still real and writable; the needed
#                 object is now in the FIRST. Isolates FILTER 2.              RED
#                 decline names it: "already present in the first real directory
#                 on that list, so there is no earlier empty entry to win from"
#                 mutant works: "plugin: supwngo reference extension v1"
#   M5  synthetic DT_NEEDED libsupwngoext.so.1 -> libz.so.1, a SYSTEM soname, with
#       (libhj_13 the RPATH shape UNCHANGED: an empty writable $ORIGIN/lib
#        shape)   preceding a $ORIGIN/vendor that HOLDS the object. FILTER 2 would
#                 open on this; FILTER 1 is the only thing that declines it.   RED
#                 decline names it: "every DT_NEEDED soname is a system library
#                 resolvable from the default directories"
#                 mutant works: "plugin: vendor module zlib 1.2.11"
#
#   SANITY, because a red proof that reds everything proves nothing: with the
#   sources restored, all five unmutated positives are GREEN again and each
#   derives its own single route (cwd / env_dir+env_dir_subdir /
#   ld_library_path / origin_rpath / dropin_scan).
#
# WHY THIS GATE CANNOT COLLIDE WITH env_path_hijack
#
# corpus_envpath/'s EnvPathHijackExecutor plants an EXECUTABLE on $PATH so a later
# `system("<relative name>")` runs it. Its gate is three facts about a HEAP WRITE
# (a size-biasing allocator wrapper, an unsigned-bounded copy loop, and a relative
# string reaching system()). None of those is required, or even looked for, by
# library_path_hijack, whose consumer is dlopen/ld.so, whose payload is a .so
# rather than a script, and whose plant location is decided by the LOADER's search
# rules. The sweep above confirms it empirically: the gate opened on zero
# corpus_envpath/ and zero corpus_inject/ targets.
#
# SILENTLY WRONG -- THE FAILURE MODES THIS FAMILY WAS BUILT TO CATCH
#
#   A STALE PLANT IS A FALSE GREEN. A .so left behind by one attempt makes the
#   NEXT attempt -- including a deliberately wrong one, and including an unrelated
#   technique measured later -- find a shell waiting for it. Red proof R4 exists
#   for exactly this: it applies the mechanism with NOTHING planted and must fail.
#   Both the reference exploit and the generated script unplant from a `finally`,
#   before and after every attempt.
#
#   DELETING THE TARGET'S OWN EMPTY DIRECTORY DISARMS IT. libhj_13's defect IS an
#   empty writable lib/. A cleanup that removed it would make the gate decline on
#   every later run -- an unsolvable-for-the-wrong-reason control, silently. The
#   generated script therefore removes ONLY directories it created itself, and the
#   reference exploit's unplant() special-cases libhj_13. This was a real bug,
#   found because the control's origin_rpath attempt left an empty lib/ inside
#   libhj_90's directory.
#
#   A HOPEFUL STRING MATCH IS NOT PROOF. The pipeline's default shell check writes
#   `echo <token>` and credits SHELL_ACCESS when the token comes back, which
#   false-positives on any target that echoes its input -- and four of these six
#   echo unknown commands. Every win in this family is proven with shell
#   ARITHMETIC (`echo SH$((6*7))OK` -> `SH42OK`) before any stdin is bridged.
#   Arithmetic and not `id`: `id` is a separate binary that must be found on
#   $PATH, and three of the five mechanisms rewrite the target's environment.
#
#   A GUESSABLE FLAG IS NOT A CAPTURE. The default flag is derived from the slug,
#   so a script that printed a plausible string would pass. The validation run
#   rebuilt the family with SUPWNGO_BENCH_FLAG set to an unguessable per-run value
#   and confirmed all ten positive reps returned THAT value.
#
#   A CFLAGS FLAG THAT SILENTLY DOES NOTHING. `-lsupwngoext` failed loudly (good)
#   but `--as-needed` would have dropped libhj_13's DT_NEEDED entry SILENTLY,
#   yielding a target with no bug that nonetheless built and ran. Every dynamic
#   tag in this family was checked with `readelf -d` after building, and the
#   verified output is recorded above.

family: libhijack
category: untrusted library search path (dlopen / RUNPATH hijack)
cwe: [CWE-426, CWE-427]
technique: library_path_hijack
executor: supwngo/exploit/pipeline/executors/library_hijack_techniques.py
reference_exploit: benchmark/reference_exploits/libhijack_variants_reference.py

build:
  # Order is load-bearing; see "WHAT cflags COULD NOT EXPRESS" above.
  - benchmark/corpus_libhijack/install_plugins.sh
  - SUPWNGO_BENCH_CORPUS=benchmark/corpus_libhijack benchmark/build_all.sh
measure:
  - python3 benchmark/measure_family.py benchmark/corpus_libhijack --timeout 300 --jobs 3

held_identical:
  legitimate_feature: loads an extension module via the dynamic loader and calls
    the documented init symbol supwngo_plugin_init
  secret: flag.txt beside the binary, path resolved absolutely from
    /proc/self/exe at startup with a fail-closed stat
  working_dir: /tmp/supwngo_libhj_<NN>, one per slug, never shared
  protections: canary + NX + PIE + Full RELRO, all ON, measured off the binaries
  win_condition: /bin/sh inside the target, proven by `echo SH$((6*7))OK` ->
    SH42OK, then used to read flag.txt

varies: how the dynamic loader is pointed at the attacker's shared object

targets:
  - slug: libhj_10_dlopen_relative_path
    role: positive
    mechanism: cwd-relative dlopen literal containing a slash
    route: cwd
    dynamic_tags: {needed: [libc.so.6], runpath: [], rpath: []}
    plant: <cwd>/plugins/libsupwngoext.so.1
    verdict: FLAG_CAPTURED by library_path_hijack (68.5s)

  - slug: libhj_11_dlopen_dir_from_env
    role: positive
    mechanism: plugin directory taken from plain getenv, no validation
    route: env_dir
    env: SUPWNGO_PLUGIN_DIR
    dynamic_tags: {needed: [libc.so.6], runpath: [], rpath: []}
    plant: $SUPWNGO_PLUGIN_DIR/libsupwngoext.so.1
    verdict: FLAG_CAPTURED by library_path_hijack (68.6s)

  - slug: libhj_12_dlopen_bare_soname
    role: positive
    mechanism: bare soname -> ld.so search; LD_LIBRARY_PATH precedes DT_RUNPATH
    route: ld_library_path
    env: LD_LIBRARY_PATH
    dynamic_tags: {needed: [libc.so.6], runpath: ["$ORIGIN/plugins"], rpath: []}
    plant: $LD_LIBRARY_PATH/libsupwngoext.so.1
    verdict: FLAG_CAPTURED by library_path_hijack (68.7s)

  - slug: libhj_13_runpath_origin
    role: positive
    mechanism: empty writable early DT_RPATH entry; DT_NEEDED sibling, no dlopen
    route: origin_rpath
    dynamic_tags:
      needed: [libsupwngoext.so.1, libc.so.6]
      runpath: []
      rpath: ["$ORIGIN/lib", "$ORIGIN/vendor"]
    plant: $ORIGIN/lib/libsupwngoext.so.1
    note: the planted object MUST define supwngo_plugin_init -- the image is
      linked -z now, so a missing symbol aborts the process before any
      constructor runs. The executor derives that from the legitimate sibling.
    verdict: FLAG_CAPTURED by library_path_hijack (69.0s)

  - slug: libhj_14_plugin_dir_scan
    role: positive
    mechanism: readdir over a drop-in directory, dlopen anything containing ".so"
    route: dropin_scan
    dynamic_tags: {needed: [libc.so.6], runpath: [], rpath: []}
    plant: /tmp/supwngo_libhj_14/<any name containing .so>
    note: the dlopen sits in a one-line load_one(path) helper while the scan is in
      its caller, so the derivation needs one interprocedural step.
    verdict: FLAG_CAPTURED by library_path_hijack (68.8s)

  - slug: libhj_90_neg_absolute_verified
    role: negative_control
    repairs:
      - absolute path under a root-owned directory; no env influence
        (secure_getenv only); no DT_RUNPATH and no DT_RPATH; nothing enumerated
      - open() + fstat() on the descriptor actually loaded, then
        dlopen("/proc/self/fd/<n>") -- the bytes mapped are the bytes checked
    dynamic_tags: {needed: [libc.so.6], runpath: [], rpath: []}
    honest_limit: its init symbol is zlibVersion, not supwngo_plugin_init, because
      a same-uid corpus can only express "a directory the attacker cannot write"
      by pointing at a real root-owned system object
    verdict: DECLINED; resisted all five mechanisms; still loads its own plugin
