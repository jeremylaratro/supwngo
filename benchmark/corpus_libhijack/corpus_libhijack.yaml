# Challenge-variation corpus manifest: UNTRUSTED LIBRARY SEARCH PATH -- dlopen /
# RUNPATH hijack (CWE-426 untrusted search path, CWE-427 uncontrolled search path
# element).
#
# The target loads an extension module through the dynamic loader from a location
# the operator can influence, so the OPERATOR -- not the program -- decides which
# ELF gets mapped. An attacker-supplied shared object then runs its own code
# inside the target process before the program can inspect anything.
#
# This is the latest non-memory-safety category in the set, after corpus_inject/
# (subprocess injection), corpus_prng/ (predictable secrets), corpus_toctou/
# (file races) and corpus_traversal/ (path traversal). It was chosen for the same
# reason they were: it is orthogonal to canary / NX / PIE / RELRO, and the whole
# family is built with every one of those ON to demonstrate it.
#
# WHAT THIS CORPUS MEASURES, AND WHAT IT DOES NOT
#
# Measures: whether one solve capability GENERALISES across the particulars of a
# single vulnerability category. Everything about the BUG and the security goal is
# held identical across all six targets and exactly one thing varies -- **how the
# loader is pointed at the attacker's object**. A per-target difference is
# therefore attributable to the pointing mechanism, not to a different bug.
#
# Held identical in every target (the source headers say it at length):
#
#   the legitimate    every target loads an extension module through the dynamic
#   feature           loader and calls the family's documented init symbol
#                     `supwngo_plugin_init` on it, printing what that returns. With
#                     the module installed where the target documents it, this
#                     WORKS NORMALLY. The module is ONE shared source for the whole
#                     family (supwngo_ext.c, SONAME libsupwngoext.so.1, installed
#                     by install_plugins.sh), so no target gets a different plugin.
#   the security      the process's code is its own. Nothing outside the program
#   goal              and its shipped module may execute inside it.
#   the secret        flag.txt sits BESIDE THE BINARY. Its path is resolved
#                     ABSOLUTELY at startup from /proc/self/exe and the program
#                     FAILS CLOSED (exits) if that path cannot be stat'd, so no
#                     cwd trick can quietly switch the barrier off -- and three of
#                     the five mechanisms DO change the cwd or the environment.
#   the working dir   one per slug, /tmp/supwngo_libhj_<NN>, never shared with
#                     another target.
#   the command loop  identical: `status` / `quit`, and no file access of any kind.
#   the protections   canary + NX + PIE + Full RELRO, all ON (see the next
#                     section), from cflags whose PROTECTION lines are identical
#                     across the family.
#   the win condition code execution inside the target process: the planted object
#                     spawns /bin/sh. Proven with a COMPUTED marker
#                     (`echo SH$((6*7))OK` -> `SH42OK`, which /bin/echo cannot
#                     produce) and then used to read the flag.txt beside the
#                     binary.
#   what is NOT here  no system(), no popen(), no execve of a $PATH name, no
#                     overflow, no format string. The only way in is the loader.
#
# Does NOT measure: anything about the other categories; and it does not claim the
# five variants are equally hard for a human -- only that each is exploitable, and
# that is proven below rather than asserted. It also does NOT measure protection
# bypass, which is the point of the next section.
#
# WHY THE PROTECTIONS ARE ALL ON AND IT DOES NOT MATTER
#
# Measured 2026-09-28 off the BUILT BINARIES via
# `supwngo.core.binary.Binary.load(p).protections`, not copied from `cflags`:
#
#   libhj_10_dlopen_relative_path   canary=True nx=True pie=True relro=Full RELRO
#   libhj_11_dlopen_dir_from_env    canary=True nx=True pie=True relro=Full RELRO
#   libhj_12_dlopen_bare_soname     canary=True nx=True pie=True relro=Full RELRO
#   libhj_13_runpath_origin         canary=True nx=True pie=True relro=Full RELRO
#   libhj_14_plugin_dir_scan        canary=True nx=True pie=True relro=Full RELRO
#   libhj_90_neg_absolute_verified  canary=True nx=True pie=True relro=Full RELRO
#
# All five positives are still solved. That is the POINT of the category rather
# than an oversight: the entire payload is a FILE ON DISK plus a cwd or an
# environment variable. No return address is overwritten, no pointer is corrupted,
# no code address is ever computed and no memory is ever corrupted at all. The
# code that runs is in the .text of a legitimately mapped, legitimately executable
# object that ld.so relocated on the attacker's behalf. There is nothing for a
# canary to check, nothing for RELRO to protect and nothing for PIE to randomise.
#
# Full RELRO is not merely harmless here, it is LOAD-BEARING in one direction --
# against the exploit. `-z now` means every relocation is resolved before any
# constructor runs, so on the DT_NEEDED route (libhj_13) an object that fails to
# DEFINE `supwngo_plugin_init` makes the loader abort the process with "undefined
# symbol" and not one instruction of the attacker's code executes. The hardening
# does not stop the category; it constrains what the planted object must contain,
# and the executor derives that requirement rather than assuming it.
#
# `-O0` is in cflags for the MEASUREMENT, not for the exploit: the executor reads
# dlopen's path argument by tracing the argument register backwards through the
# -O0 `lea`/`mov` chain, and at -O2 that chain may not exist. The DEFECT is
# equally present at -O2 (it is in the dynamic section and in the .rodata strings)
# but the static derivation of WHICH route to take is what needs -O0.
#
# cflags: the five PROTECTION lines are identical across all six targets
# (md5 284f0ddcc90af5ea8ebe54d18129d84e over
# `-fstack-protector-all -pie -fPIE -Wl,-z,relro,-z,now -O0`). The files are NOT
# byte-identical, unlike corpus_toctou's, and they cannot be: the one variable
# this family varies is a LINK-TIME property for two of the six targets, so the
# mechanism lives partly in cflags. Effective flag lists, as build_all.sh parses
# them:
#
#   libhj_10  -ldl <protections>
#   libhj_11  -ldl <protections>
#   libhj_12  -ldl -Wl,--enable-new-dtags -Wl,-rpath,$ORIGIN/plugins <protections>
#   libhj_13  -L/tmp/supwngo_libhj_linkdir -Wl,--no-as-needed
#             -l:libsupwngoext.so.1 -Wl,--disable-new-dtags
#             -Wl,-rpath,$ORIGIN/lib:$ORIGIN/vendor <protections>
#   libhj_14  -ldl <protections>
#   libhj_90  -ldl <protections>
#
# WHAT cflags COULD NOT EXPRESS, SAID PLAINLY RATHER THAN WORKED AROUND
#
# `benchmark/build_all.sh` compiles exactly ONE artifact per target directory
# (`<slug>.c` -> `<slug>`). `cflags` therefore cannot express two things this
# family needs:
#
#   1. the legitimate extension module -- a SHARED OBJECT, i.e. a second gcc
#      output; and
#   2. for libhj_13, a real sibling library that has to EXIST AT LINK TIME so the
#      executable can be linked against it and acquire a DT_NEEDED entry.
#
# Rather than silently building a different program (a family with no plugin to
# load, or a libhj_13 with no DT_NEEDED at all), provisioning is split in two and
# documented. **install_plugins.sh must run BEFORE build_all.sh**:
#
#     benchmark/corpus_libhijack/install_plugins.sh
#     SUPWNGO_BENCH_CORPUS=benchmark/corpus_libhijack benchmark/build_all.sh
#
# This is a REPORTABLE LIMITATION of the cflags mechanism, not a defect in the
# family. Two consequences follow and both were measured, not guessed:
#
#   * libhj_13's cflags carries an ABSOLUTE `-L/tmp/supwngo_libhj_linkdir`. A
#     relative -L would be resolved against gcc's cwd -- whatever directory
#     build_all.sh happened to be invoked from -- and would silently drop the
#     DT_NEEDED entry, producing a target with no bug. A committed cflags also
#     must not contain a host-specific checkout path. /tmp is the only location
#     that satisfies both, and install_plugins.sh creates it.
#   * `-lsupwngoext` does NOT work and the measured error is
#     `/usr/bin/ld: cannot find -lsupwngoext`: plain -l looks for
#     `libsupwngoext.so` or `.a`, the development symlink a packaged library
#     would ship, and this family installs only the runtime soname. The cflags
#     line is the exact-filename form `-l:libsupwngoext.so.1`.
#   * build_all.sh places cflags BEFORE the source file, so Ubuntu's default
#     `--as-needed` would have dropped the DT_NEEDED entry for a library whose
#     symbols are referenced only by the later object. `-Wl,--no-as-needed` is
#     there for that reason and `readelf -d` was checked afterwards.
#
# A third thing nothing in this repo can express: libhj_13 ships an EMPTY
# `lib/` directory, and git does not track empty directories. install_plugins.sh
# recreates it. The gate depends on it existing (see FILTER 2 below), so a fresh
# checkout that skips install_plugins.sh yields a libhj_13 the executor declines.
#
# VERIFIED DYNAMIC TAGS (readelf -d, 2026-09-28)
#
#   libhj_10  NEEDED libc.so.6                       FLAGS BIND_NOW, NOW PIE
#   libhj_11  NEEDED libc.so.6                       FLAGS BIND_NOW, NOW PIE
#   libhj_12  NEEDED libc.so.6
#             RUNPATH $ORIGIN/plugins                FLAGS BIND_NOW, NOW PIE
#   libhj_13  NEEDED libsupwngoext.so.1, libc.so.6
#             RPATH   $ORIGIN/lib:$ORIGIN/vendor     BIND_NOW, NOW PIE
#   libhj_14  NEEDED libc.so.6                       FLAGS BIND_NOW, NOW PIE
#   libhj_90  NEEDED libc.so.6                       FLAGS BIND_NOW, NOW PIE
#             (no RPATH, no RUNPATH -- grep prints nothing)
#
# Both dynamic tags are represented on purpose. ld.so does NOT treat them the
# same: DT_RPATH is searched BEFORE LD_LIBRARY_PATH, DT_RUNPATH after it, and the
# loader ignores DT_RPATH entirely on an object that also has a DT_RUNPATH.
# libhj_12 gets DT_RUNPATH (-Wl,--enable-new-dtags) and libhj_13 gets DT_RPATH
# (-Wl,--disable-new-dtags), so the executor's handling of the distinction is
# exercised rather than assumed.
#
# THE ONE VARIABLE: HOW THE LOADER IS POINTED AT THE OBJECT
#
#   libhj_10  cwd-relative dlopen. `dlopen("./plugins/libsupwngoext.so.1")`. A
#             relative path CONTAINING A SLASH makes ld.so skip every search rule
#             and resolve the string against the process's cwd, so whoever starts
#             the program decides what "." means.
#   libhj_11  directory from the environment. `getenv("SUPWNGO_PLUGIN_DIR")`,
#             snprintf'd with the soname, dlopen'd. Plain getenv, not
#             secure_getenv, and no validation of any kind on the named directory.
#   libhj_12  bare soname. `dlopen("libsupwngoext.so.1")` -- no slash, which is
#             the one thing that makes ld.so run its SEARCH algorithm. For a
#             dlopen from an executable, LD_LIBRARY_PATH is consulted BEFORE the
#             calling object's own DT_RUNPATH, so the legitimate
#             `$ORIGIN/plugins` loses to an attacker's LD_LIBRARY_PATH.
#   libhj_13  writable early RPATH entry, and NO dlopen at all. The extension is
#             an ordinary DT_NEEDED sibling resolved by ld.so at process startup;
#             the init symbol is bound by the linker, not looked up with dlsym.
#             DT_RPATH is `$ORIGIN/lib:$ORIGIN/vendor`; the legitimate copy is in
#             `vendor/`, the SECOND entry, and `lib/` -- the FIRST -- ships EMPTY
#             and writable. An empty-but-writable early search-path entry is the
#             whole defect: anything dropped into $ORIGIN/lib satisfies the soname
#             first and is mapped, relocated and CONSTRUCTED before main() runs.
#   libhj_14  drop-in directory scan. opendir/readdir over the working directory,
#             every entry whose name merely CONTAINS ".so" handed to dlopen, then
#             dlsym. The program loads whatever it enumerates, so the FILENAME is
#             free -- and the plant does not have to impersonate anything.
#
#   libhj_90  THE NEGATIVE CONTROL. See "THE CONTROL" below.
#
# THE CONTROL, AND WHY IT IS REPAIRED TWICE
#
# A control that is one edit away from being a positive measures nothing, so
# libhj_90_neg_absolute_verified is repaired two INDEPENDENT ways. Either repair
# alone defeats all five mechanisms; both are present.
#
#   REPAIR 1 -- no channel exists that could point the loader elsewhere.
#     vs libhj_10  the module path is a compile-time ABSOLUTE string under a
#                  ROOT-OWNED directory. Leading '/' means the cwd is never
#                  consulted, and the operator cannot write that directory.
#     vs libhj_11  NO environment variable reaches any path. The one environment
#                  read that remains is a verbosity flag, through secure_getenv().
#     vs libhj_12  the path contains slashes, so ld.so does no search at all:
#                  LD_LIBRARY_PATH, ld.so.cache and the default directories are
#                  never consulted for it.
#     vs libhj_13  the image has NO DT_RUNPATH and NO DT_RPATH -- not an $ORIGIN
#                  one, not any one -- and no non-system DT_NEEDED entry.
#     vs libhj_14  nothing is enumerated. There is no opendir/readdir/scandir in
#                  the image; exactly one module is loaded and its name is a
#                  constant.
#
#   REPAIR 2 -- the file actually loaded is identity-checked first. The program
#     open()s the path ONCE, answers the whole policy with fstat() on THE
#     DESCRIPTOR IT WILL LOAD FROM (plain file, exactly one link, expected owner
#     uid), and then loads THAT DESCRIPTOR via /proc/self/fd/<n> rather than
#     re-resolving the name. The bytes mapped are provably the bytes checked --
#     there is no second path walk for a swap to land in, which is also why this
#     control cannot be attacked as a TOCTOU race.
#
# It is still a genuinely working program: it loads its module and calls that
# module's documented init symbol, so a DECLINE is a decline and not a crash.
# That was checked, not assumed -- see the harness positive control below.
#
# THE CONTROL'S HONEST LIMIT
#
# "A directory the attacker cannot write" is only expressible in a SAME-UID
# corpus by pointing at a real system directory. The control's legitimate
# extension module is therefore a vendor system object --
# /lib/x86_64-linux-gnu/libz.so.1, root-owned in a root-owned directory -- and
# its documented init symbol is that module's own `zlibVersion()` rather than the
# family's `supwngo_plugin_init`. That is the ONE respect in which this target
# differs from the family beyond the absence of the bug, and it is a consequence
# of the "cannot write" requirement rather than a free choice: the family's own
# extension cannot be installed under a root-owned prefix without root. A real
# deployment would ship the family extension under /usr/lib and this control
# would be byte-for-byte the same program with a different pair of constants.
#
# VALIDATION -- DONE BEFORE ANYTHING TRUSTED THE CORPUS
#
# benchmark/reference_exploits/libhijack_variants_reference.py is a deterministic
# per-target reference exploit, written and run BEFORE the executor existed. Run
# 2026-09-28, exit 0, 0.44s wall:
#
#   HARNESS POSITIVE CONTROL -- all six targets load their LEGITIMATE plugin.
#     This runs FIRST. Without it, "the control cannot be hijacked" is
#     indistinguishable from "the control is broken", which is the
#     unsolvable-for-the-wrong-reason failure this section exists to exclude.
#
#   POSITIVES -- 5 targets x 2 reps = 10 wins. Every rep produced BOTH the
#     computed shell marker SH42OK and the flag. The flag was the per-run secret
#     FLAG{libhj_perrun_uqp70r}, installed by rebuilding with SUPWNGO_BENCH_FLAG,
#     so it could not have been guessed from the sources.
#
#   NEGATIVE CONTROL -- libhj_90 attacked with ALL FIVE mechanisms: cwd, env_dir,
